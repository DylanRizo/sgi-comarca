name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: sgi_dev
          POSTGRES_PASSWORD: sgi_dev_password
          POSTGRES_DB: sgi_comarca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgi_dev -d sgi_comarca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sgi_dev:sgi_dev_password@localhost:5432/sgi_comarca_test?schema=public
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SWAGGER_ENABLED: false
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
